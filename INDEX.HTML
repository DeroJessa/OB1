<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBLIN — AI Companion</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #04060f; color: #cfe9ff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0; display: block;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #ui {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px;
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase;
    color: #7fc4ff;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4a5c78; box-shadow: 0 0 8px #4a5c78;
    transition: background .2s, box-shadow .2s;
  }
  .dot.live { animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0%,100% { opacity: .5; transform: scale(.85); }
    50%     { opacity: 1;  transform: scale(1.2); }
  }

  .bottombar {
    padding: 0 18px 26px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }

  #meter {
    width: min(70vw, 380px); height: 6px; border-radius: 999px;
    background: rgba(90, 160, 255, .15);
    overflow: hidden; opacity: 0; transition: opacity .2s;
  }
  #meter.show { opacity: 1; }
  #meter > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #3aa0ff, #6ff0d0);
    border-radius: 999px;
    transition: width .05s linear;
  }

  #heard {
    max-width: 700px; min-height: 18px; text-align: center;
    font-size: 13px; font-style: italic; color: #79b8ff;
    opacity: 0; transition: opacity .18s;
    pointer-events: none;
  }

  #diag {
    max-width: 720px; min-height: 16px; text-align: center;
    font-size: 12px; line-height: 1.4; color: #ffb27a;
    opacity: 0; transition: opacity .25s;
    pointer-events: none; padding: 0 8px;
  }
  #diag.show { opacity: 1; }

  #sub {
    max-width: 760px; text-align: center; font-size: 15px; line-height: 1.55;
    color: #a8d4ff; min-height: 48px;
    text-shadow: 0 0 18px rgba(90,180,255,.5);
    padding: 0 8px;
  }

  .controls {
    display: flex; gap: 10px; align-items: center;
    pointer-events: auto; flex-wrap: wrap; justify-content: center;
    margin-top: 4px;
  }

  button, input {
    font: inherit; color: #dff1ff;
    background: rgba(20, 45, 90, .55);
    border: 1px solid rgba(90, 180, 255, .35);
    border-radius: 999px;
    padding: 11px 20px;
    backdrop-filter: blur(10px);
    outline: none;
    transition: .18s;
  }
  button { cursor: pointer; letter-spacing: .06em; }
  button:hover {
    background: rgba(40, 90, 170, .7);
    border-color: rgba(120, 210, 255, .7);
    box-shadow: 0 0 24px rgba(80, 180, 255, .35);
  }
  button:active { transform: scale(.97); }
  input { width: min(48vw, 340px); }
  input::placeholder { color: rgba(150, 200, 255, .45); }
  input:focus { border-color: rgba(120, 210, 255, .8); box-shadow: 0 0 22px rgba(80,180,255,.3); }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="ui">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <span id="status">IDLE</span>
  </div>

  <div class="bottombar">
    <div id="meter"><i></i></div>
    <div id="heard"></div>
    <div id="diag"></div>
    <div id="sub">Click anywhere to start — say hello to Oblin, or just talk.</div>
    <div class="controls">
      <button id="mic">Wake</button>
      <input id="text" type="text" placeholder="Type anything…" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   STATE — declared FIRST so the draw loop can never hit a
   temporal-dead-zone error and blank the canvas.
   ========================================================= */
let speaking    = false;
let wantListening = false;
let recognizing   = false;
let manuallyOff   = true;

let mouth      = 0;
let wakePulse  = 0;
let blinkStart = -10;
let nextBlink  = 1.5;
let micLevel   = 0;
let lastFrame  = performance.now();

/* entrance animation */
let introStart = performance.now();
let introProgress = 0;

/* =========================================================
   CANVAS CHARACTER
   ========================================================= */
const canvas = document.getElementById('stage');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 140;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2;
  cy = H * 0.42;
  /* bigger, more visible character */
  R = Math.max(70, Math.min(Math.min(W, H) * 0.185, 190));
}
window.addEventListener('resize', resize);
resize();

const EMOTION_COLORS = {
  neutral: [95, 195, 255],
  happy:   [120, 240, 255],
  excited: [255, 210, 130],
  sad:     [140, 160, 255],
  calm:    [125, 230, 225],
  curious: [180, 165, 255],
  warm:    [255, 185, 205]
};
let glow = [...EMOTION_COLORS.neutral];
function setEmotion(e) {
  const c = EMOTION_COLORS[e] || EMOTION_COLORS.neutral;
  glow = c;
}

const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
window.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

const particles = Array.from({ length: 52 }, () => ({
  a:     Math.random() * TAU,
  r:     1.35 + Math.random() * 1.55,
  speed: (0.12 + Math.random() * 0.45) * (Math.random() < 0.5 ? -1 : 1),
  size:  0.7 + Math.random() * 2.0,
  tilt:  Math.random() * Math.PI
}));

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function draw(now) {
  try {
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    const t = now / 1000;
    const [gr, gg, gb] = glow;

    /* entrance */
    const introElapsed = (now - introStart) / 1000;
    introProgress = Math.min(1, introElapsed / 1.4);
    const ease = 1 - Math.pow(1 - introProgress, 3);
    const introScale = 0.35 + 0.65 * ease;
    const introGlow = 0.4 + 0.6 * ease;

    ctx.clearRect(0, 0, W, H);

    /* background */
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.65);
    bg.addColorStop(0,    `rgba(${gr},${gg},${gb},${0.22 * introGlow})`);
    bg.addColorStop(0.42, 'rgba(24,60,140,0.09)');
    bg.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    /* blink */
    if (t > nextBlink) { blinkStart = t; nextBlink = t + 2.2 + Math.random() * 4.5; }
    const bk = (t - blinkStart) / 0.17;
    const eyeOpen = (bk >= 0 && bk <= 1) ? 1 - Math.sin(bk * Math.PI) : 1;

    /* mouth target */
    let targetMouth;
    if (speaking) targetMouth = 0.28 + 0.72 * Math.abs(Math.sin(t * 15)) * (0.55 + 0.45 * Math.sin(t * 2.3));
    else if (wantListening) targetMouth = 0.04 + micLevel * 0.55;
    else targetMouth = 0.03;
    mouth += (targetMouth - mouth) * Math.min(1, dt * 18);

    wakePulse *= Math.pow(0.05, dt);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(introScale, introScale);

    const Rr = R;

    /* orbit rings */
    const rings = [
      { r: 1.55, tilt:  0.60, spin:  0.25, alpha: 0.45, lw: 1.7, dot: 2.8 },
      { r: 1.90, tilt: -0.85, spin: -0.17, alpha: 0.30, lw: 1.4, dot: 2.4 },
      { r: 2.28, tilt:  1.30, spin:  0.11, alpha: 0.18, lw: 1.2, dot: 2.0 }
    ];

    for (const rg of rings) {
      const rot = rg.tilt + t * rg.spin;
      ctx.beginPath();
      ctx.ellipse(0, 0, rg.r * Rr, rg.r * Rr * 0.42, rot, 0, TAU);
      ctx.strokeStyle = `rgba(${gr},${gg},${gb},${rg.alpha * introGlow})`;
      ctx.lineWidth = rg.lw;
      ctx.stroke();

      const ang = t * (rg.spin * 4.2) + rg.tilt * 1.7;
      const ex = Math.cos(ang) * rg.r * Rr;
      const ey = Math.sin(ang) * rg.r * Rr * 0.42;
      const px = ex * Math.cos(rot) - ey * Math.sin(rot);
      const py = ex * Math.sin(rot) + ey * Math.cos(rot);

      ctx.beginPath();
      ctx.arc(px, py, rg.dot, 0, TAU);
      ctx.fillStyle = `rgba(210,248,255,${0.95 * introGlow})`;
      ctx.fill();
    }

    /* particles */
    for (const p of particles) {
      p.a += p.speed * dt;
      const rot = p.tilt + t * 0.05;
      const ex  = Math.cos(p.a) * p.r * Rr;
      const ey  = Math.sin(p.a) * p.r * Rr * 0.42;
      const px  = ex * Math.cos(rot) - ey * Math.sin(rot);
      const py  = ex * Math.sin(rot) + ey * Math.cos(rot);
      const depth = (Math.sin(p.a) + 1) / 2;

      ctx.beginPath();
      ctx.arc(px, py, p.size * (0.6 + depth * 0.85), 0, TAU);
      ctx.fillStyle = `rgba(${gr},${gg},${gb},${(0.14 + depth * 0.65) * introGlow})`;
      ctx.fill();
    }

    /* wake shockwave */
    if (wakePulse > 0.01) {
      const p = 1 - wakePulse;
      for (let i = 0; i < 2; i++) {
        const rr = Rr * (1 + p * 2.2 + i * 0.35);
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, TAU);
        ctx.strokeStyle = `rgba(${gr},${gg},${gb},${wakePulse * (0.6 - i * 0.22)})`;
        ctx.lineWidth = 3 * wakePulse + 0.5;
        ctx.stroke();
      }
    }

    /* listening ring */
    if (wantListening && !speaking) {
      ctx.save();
      ctx.rotate(t * 0.9);
      ctx.setLineDash([6, 14]);
      ctx.beginPath();
      ctx.arc(0, 0, Rr * 1.45, 0, TAU);
      ctx.strokeStyle = 'rgba(120,255,200,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    /* outer aura */
    const glowR = Rr * (1.95 + mouth * 0.30);
    const gl = ctx.createRadialGradient(0, 0, Rr * 0.55, 0, 0, glowR);
    gl.addColorStop(0, `rgba(${gr},${gg},${gb},${(0.32 + mouth * 0.28) * introGlow})`);
    gl.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(0, 0, glowR, 0, TAU);
    ctx.fill();

    /* sphere body */
    const sg = ctx.createRadialGradient(-Rr * 0.35, -Rr * 0.40, Rr * 0.05, 0, 0, Rr * 1.05);
    sg.addColorStop(0,    '#4588e8');
    sg.addColorStop(0.45, '#17356e');
    sg.addColorStop(0.80, '#0a1738');
    sg.addColorStop(1,    '#050a1c');
    ctx.beginPath();
    ctx.arc(0, 0, Rr, 0, TAU);
    ctx.fillStyle = sg;
    ctx.fill();

    /* rim light */
    ctx.save();
    ctx.shadowColor = `rgba(${gr},${gg},${gb},0.95)`;
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.arc(0, 0, Rr - 1, 0, TAU);
    ctx.strokeStyle = `rgba(${gr},${gg},${gb},0.85)`;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();

    /* specular */
    ctx.beginPath();
    ctx.ellipse(-Rr * 0.30, -Rr * 0.45, Rr * 0.42, Rr * 0.20, -0.6, 0, TAU);
    ctx.fillStyle = 'rgba(210,245,255,0.12)';
    ctx.fill();

    /* scanlines */
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, Rr, 0, TAU);
    ctx.clip();
    ctx.fillStyle = 'rgba(127,212,255,0.07)';
    for (let y = -Rr + ((t * 26) % 7); y < Rr; y += 7) {
      ctx.fillRect(-Rr, y, Rr * 2, 1.2);
    }
    ctx.restore();

    /* eyes */
    const lookX = Math.max(-1, Math.min(1, (mouse.x - cx) / (W * 0.5))) * Rr * 0.05;
    const lookY = Math.max(-1, Math.min(1, (mouse.y - cy) / (H * 0.5))) * Rr * 0.04;

    const eyeY = -Rr * 0.13 + lookY;
    const eyeX = Rr * 0.32;
    const eyeW = Rr * 0.155;
    const eyeH = Math.max(Rr * 0.02, Rr * 0.225 * eyeOpen);

    ctx.save();
    ctx.shadowColor = 'rgba(155,245,255,0.98)';
    ctx.shadowBlur  = 26;
    ctx.fillStyle   = '#baf6ff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * eyeX + lookX, eyeY, eyeW, eyeH, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    /* mouth */
    const mw = Rr * 0.46;
    const mh = Math.max(Rr * 0.035, mouth * Rr * 0.34);

    ctx.save();
    ctx.shadowColor = 'rgba(155,245,255,0.92)';
    ctx.shadowBlur  = 22;
    ctx.fillStyle   = '#baf6ff';
    roundRect(ctx, -mw / 2, Rr * 0.28, mw, mh, mh / 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  } catch (err) {
    console.error('draw error:', err);
  }

  requestAnimationFrame(draw);
}

/* start the loop immediately — character is visible from frame 1 */
requestAnimationFrame(draw);

/* =========================================================
   UI REFS
   ========================================================= */
const statusEl  = document.getElementById('status');
const dotEl     = document.getElementById('dot');
const subEl     = document.getElementById('sub');
const heardEl   = document.getElementById('heard');
const diagEl    = document.getElementById('diag');
const meterEl   = document.getElementById('meter');
const meterBar  = meterEl.querySelector('i');
const micBtn    = document.getElementById('mic');
const textInput = document.getElementById('text');
const sendBtn   = document.getElementById('send');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setStatus(txt, color, live) {
  statusEl.textContent = txt;
  dotEl.style.background = color;
  dotEl.style.boxShadow  = `0 0 12px ${color}`;
  dotEl.classList.toggle('live', !!live);
}
function refreshStatus() {
  if (speaking)                 setStatus('SPEAKING',     '#ffd166', true);
  else if (recognizing)         setStatus('LISTENING',    '#58c8ff', true);
  else if (wantListening)       setStatus('RECONNECTING', '#8aa0c0', true);
  else                          setStatus('IDLE',         '#4a5c78', false);
}
refreshStatus();

/* =========================================================
   FEMALE VOICE
   ========================================================= */
const FEMALE_HINTS = [
  'samantha','victoria','karen','moira','tessa','fiona','serena','zira','aria','jenny',
  'emma','olivia','ava','susan','allison','amelie','kate','stephanie','linda','heather',
  'michelle','nicole','catherine','ivy','joanna','salli','kendra','kimberly','sophie',
  'google uk english female','google us english','female','woman','zoe','amy','emily',
  'chloe','isabella','mia','luna','clara','ella','grace','nora','sara','paula','monica',
  'penelope','luciana','joana','marlene','vicki','carmit','damayanti','andika','kathy'
];
const MALE_HINTS = [
  'david','mark','daniel','alex','fred','george','james','tom','oliver','aaron','arthur',
  'guy','ryan','eric','matthew','justin','brian','male','man','rishi','liam','william',
  'enrique','jorge','diego','juan','carlos','miguel','stefan','klaus','hans','thomas',
  'gordon','fraser','roger','steffan','lee'
];

let femaleVoice = null;
let ttsRate    = 1.03;
let ttsPitch   = 1.45;

function scoreVoice(v) {
  const n = (v.name || '').toLowerCase();
  const l = (v.lang || '').toLowerCase();
  let score = 0;
  for (const h of FEMALE_HINTS) if (n.includes(h)) { score += 60; break; }
  for (const h of MALE_HINTS)   if (n.includes(h)) { score -= 100; break; }
  if (n.includes('female')) score += 40;
  if (n.includes('google')) score += 22;
  if (n.includes('natural') || n.includes('neural') || n.includes('premium')) score += 30;
  if (l.startsWith('en-us')) score += 20;
  else if (l.startsWith('en-gb')) score += 16;
  else if (l.startsWith('en')) score += 12;
  else score -= 40;
  if (v.localService) score += 3;
  return score;
}
function chooseFemaleVoice() {
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices() || [];
  if (!all.length) return;
  const english = all.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
  const pool = english.length ? english : all;
  const ranked = pool.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a));
  const best = ranked[0];
  if (best && scoreVoice(best) > 0) femaleVoice = best;
  else femaleVoice = pool.find(v => /female|woman|samantha|zira|karen|moira|tessa/i.test(v.name)) || pool[0];
}
chooseFemaleVoice();
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = chooseFemaleVoice;
  setTimeout(chooseFemaleVoice, 300);
  setTimeout(chooseFemaleVoice, 1200);
}

/* =========================================================
   THE BRAIN (unchanged — full conversation engine)
   ========================================================= */
const Brain = (() => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const recent = [];
  function fresh(list) {
    if (!list || !list.length) return '';
    for (let i = 0; i < 12; i++) {
      const c = pick(list);
      if (!recent.includes(c)) { recent.push(c); if (recent.length > 12) recent.shift(); return c; }
    }
    const c = pick(list);
    recent.push(c); if (recent.length > 12) recent.shift();
    return c;
  }

  const S = {
    userName: null, mood: 'neutral',
    lastTopic: null, lastMore: [],
    lastReply: '', turn: 0,
    jokeIdx: -1, factIdx: -1, riddle: null, riddleTries: 0
  };

  const JOKES = [

  ];

  const FACTS = [

  ];

  const RIDDLES = [
    { q: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?", a: "echo" },
    { q: "The more of me you take, the more you leave behind. What am I?", a: "footstep" },

    { q: "What has a head and a tail but no body?", a: "coin" },
    { q: "I have cities but no houses, forests but no trees, and water but no fish. What am I?", a: "map" },
    { q: "What can travel around the world while staying in the same corner?", a: "stamp" },
    { q: "What has many teeth but cannot bite?", a: "comb" },
    { q: "I'm always in front of you but can't be seen. What am I?", a: "future" }
  ];

  const QUOTES = [
    "“The important thing is not to stop questioning.” — Albert Einstein",

  const norm = s => (' ' + s.toLowerCase().replace(/[^a-z0-9\s']/g, ' ').replace(/\s+/g, ' ') + ' ');

  function matchTopic(text) {
    const n = norm(text);

    for (const t of TOPICS) {
      let sc = 0;
      for (const k of t.keys) if (k.test(n)) sc++;
      if (sc > bestScore) { bestScore = sc; best = t; }
    }
    return bestScore > 0 ? best : null;
  }

    if (!/[+\-*/]/.test(clean)) return null;

/* =========================================================
   TTS
   ========================================================= */
let echoBuf = '';
let echoUntil = 0;
let sayToken = 0;
let sayHardTimer = null;

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
  const out = [];
  let buf = '';
  for (const p of parts) {
    if ((buf + p).length > 160 && buf) { out.push(buf.trim()); buf = p; }
    else buf += p;
  }
  if (buf.trim()) out.push(buf.trim());
  return out.filter(Boolean);
}

function say(text, emotion) {
  if (!text) return;
  if (emotion) setEmotion(emotion);
  subEl.textContent = text;
  Brain.setLastReply(text);

  const token = ++sayToken;
  clearTimeout(sayHardTimer);
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }

  speaking = true;
  refreshStatus();

  echoBuf = text;
  echoUntil = performance.now() + 4000 + text.length * 90;

  if (!('speechSynthesis' in window)) {
    sayHardTimer = setTimeout(() => {
      if (token !== sayToken) return;
      speaking = false; mouth = 0; echoBuf = '';
      refreshStatus();
    }, 1200 + text.length * 65);
    return;
  }

  const chunks = splitSentences(text);
  let i = 0;

  const next = () => {
    if (token !== sayToken) return;
    if (i >= chunks.length) {
      speaking = false; mouth = 0; echoBuf = '';
      echoUntil = performance.now() + 700;
      clearTimeout(sayHardTimer);
      refreshStatus();
      return;
    }
    const chunk = chunks[i++];
    const u = new SpeechSynthesisUtterance(chunk);
    if (femaleVoice) { u.voice = femaleVoice; u.lang = femaleVoice.lang; }
    else u.lang = 'en-US';
    u.pitch = ttsPitch;
    u.rate  = ttsRate;
    u.volume = 1;

    let done = false;
    const go = () => {
      if (done || token !== sayToken) return;
      done = true;
      next();
    };
    u.onend = go;
    u.onerror = go;

    try { speechSynthesis.speak(u); }
    catch (e) { go(); return; }
  };

  next();

  sayHardTimer = setTimeout(() => {
    if (token !== sayToken) return;
    if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
    speaking = false; mouth = 0; echoBuf = '';
    echoUntil = performance.now() + 500;
    refreshStatus();
  }, 5000 + text.length * 130);
}

function stopSpeech() {
  sayToken++;
  clearTimeout(sayHardTimer);
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
  speaking = false;
  mouth = 0;
  echoBuf = '';
  echoUntil = performance.now() + 500;
  refreshStatus();
}

/* =========================================================
   ECHO GUARD
   ========================================================= */
function normText(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

function isEcho(txt) {
  if (performance.now() > echoUntil) return false;
  if (!echoBuf) return false;
  const words = normText(txt).split(' ').filter(w => w.length > 2);
  if (!words.length) return false;
  const echo = normText(echoBuf);
  let hit = 0;
  for (const w of words) if (echo.includes(w)) hit++;
  return hit / words.length >= 0.6;
}

/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */
const NAME_RE  = /\b(oblin|obline|obling|oblinn|obblin|obleen|oblean|oblynn|oblen|oblyn|oblan|oblon|obin|oplin)\b/i;
const GREET_RE = /^(hello|hi|hey|hiya|howdy|greetings|yo|sup|good morning|good afternoon|good evening)\b/i;

let recognition = null;
let restartTimer = null;
let restartAttempts = 0;
let startGuardTimer = null;

let lastFiredKey = '';
let lastFiredAt = 0;
let lastInterimKey = '';
let lastInterimAt = 0;
let lastHeardAt = 0;

if (SR) {
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognizing = true;
    restartAttempts = 0;
    clearTimeout(startGuardTimer);
    refreshStatus();
    subEl.textContent = "I'm listening — say hello to Oblin, or just talk.";
  };

  recognition.onresult = (e) => {
    let interim = '';
    let finalText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const t = (r[0].transcript || '').trim();
      if (!t) continue;
      if (r.isFinal) finalText += ' ' + t;
      else interim += ' ' + t;
    }

    if (interim.trim()) {
      showHeard(interim.trim());
      lastHeardAt = performance.now();
      if (NAME_RE.test(interim) && !isEcho(interim)) fire(interim.trim(), true);
    }

    if (finalText.trim()) {
      const t = finalText.trim();
      showHeard(t);
      lastHeardAt = performance.now();
      if (!isEcho(t)) {
        const key = normText(t);
        if (lastInterimKey && performance.now() - lastInterimAt < 2500 && key.startsWith(lastInterimKey)) {
          /* already answered */
        } else {
          fire(t, false);
        }
      }
    }
  };

  recognition.onerror = (e) => {
    recognizing = false;
    const err = e.error;

    if (err === 'not-allowed' || err === 'service-not-allowed') {
      wantListening = false; manuallyOff = true;
      micBtn.textContent = 'Wake';
      subEl.textContent = 'Microphone permission was denied. Allow it in the address bar, then click Wake.';
      setStatus('MIC DENIED', '#ff7a7a', false);
      return;
    }
    if (err === 'audio-capture') {
      closeMeter();
      wantListening = false; manuallyOff = true;
      micBtn.textContent = 'Wake';
      subEl.textContent = 'No usable microphone. Check your device, then click Wake.';
      setStatus('NO MIC', '#ff7a7a', false);
      return;
    }
    if (err === 'network') {
      showDiag("Chrome cannot reach Google's speech service. Check your internet connection.");
      scheduleRestart(2000);
      return;
    }
    if (err === 'no-speech' || err === 'aborted') return;
    scheduleRestart(500);
  };

  recognition.onend = () => {
    recognizing = false;
    refreshStatus();
    if (wantListening && !manuallyOff) scheduleRestart(50);
  };
} else {
  subEl.textContent = 'This browser has no speech recognition — type below to chat.';
}

function startSR() {
  if (!recognition || recognizing) return;
  clearTimeout(restartTimer);
  try {
    recognition.start();
  } catch (e) {
    if (e && e.name === 'InvalidStateError') {
      try { recognition.stop(); } catch (_) {}
      scheduleRestart(300);
    } else {
      scheduleRestart(600);
    }
    return;
  }

  clearTimeout(startGuardTimer);
  startGuardTimer = setTimeout(() => {
    if (!recognizing && wantListening) {
      try { recognition.abort(); } catch (_) {}
      scheduleRestart(300);
    }
  }, 3000);
}

function scheduleRestart(delay) {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (!wantListening || manuallyOff) return;
    restartAttempts++;
    startSR();
  }, Math.min(delay, 2500));
}

/* =========================================================
   FIRING A REPLY
   ========================================================= */
function fire(text, fromInterim) {
  const now = performance.now();
  const key = normText(text);
  if (!key || key.length < 2) return;

  if (key === lastFiredKey && now - lastFiredAt < 1800) return;
  if (!fromInterim && lastInterimKey && now - lastInterimAt < 2500 && key.startsWith(lastInterimKey)) return;

  lastFiredKey = key;
  lastFiredAt = now;
  if (fromInterim) { lastInterimKey = key; lastInterimAt = now; }

  wakePulse = 1;

  if (speaking) stopSpeech();

  const reply = Brain.respond(text);
  if (reply.action === 'stop') { stopSpeech(); return; }
  if (reply.action === 'slower') ttsRate = Math.max(0.6, ttsRate - 0.15);
  if (reply.action === 'faster') ttsRate = Math.min(1.6, ttsRate + 0.15);

  if (reply.text) say(reply.text, reply.emotion);
}

/* =========================================================
   MIC METER + DIAGNOSTICS
   ========================================================= */
let meterStream = null, audioCtx = null, analyser = null, meterData = null;
let loudSince = 0;

async function openMeter() {
  if (meterStream || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
  meterStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const src = audioCtx.createMediaStreamSource(meterStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.7;
  src.connect(analyser);
  meterData = new Uint8Array(analyser.frequencyBinCount);
  meterEl.classList.add('show');
}
function closeMeter() {
  meterEl.classList.remove('show');
  if (meterStream) { meterStream.getTracks().forEach(t => t.stop()); meterStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  analyser = null; meterData = null; micLevel = 0;
  meterBar.style.width = '0%';
}

setInterval(() => {
  if (!analyser || !meterData) return;
  analyser.getByteTimeDomainData(meterData);
  let sum = 0;
  for (let i = 0; i < meterData.length; i++) {
    const v = (meterData[i] - 128) / 128;
    sum += v * v;
  }
  micLevel = Math.min(1, Math.sqrt(sum / meterData.length) * 4.5);
  meterBar.style.width = Math.round(micLevel * 100) + '%';
  if (micLevel > 0.08) loudSince = performance.now();
}, 60);

let diagTimer = null;
function showDiag(msg) {
  diagEl.textContent = msg;
  diagEl.classList.add('show');
  clearTimeout(diagTimer);
  diagTimer = setTimeout(() => diagEl.classList.remove('show'), 9000);
}

setInterval(() => {
  if (!wantListening) return;
  const now = performance.now();
  if (loudSince && now - loudSince > 2500 && now - lastHeardAt > 6000 && !speaking) {
    showDiag("I can hear sound from your mic, but nothing is being transcribed. Chrome may be offline or blocked from Google's speech service.");
    loudSince = 0;
  }
}, 3000);

let heardTimer = null;
function showHeard(txt) {
  heardEl.textContent = '“' + txt + '”';
  heardEl.style.opacity = '1';
  clearTimeout(heardTimer);
  heardTimer = setTimeout(() => { heardEl.style.opacity = '0'; }, 2200);
}

/* =========================================================
   MIC CONTROL
   ========================================================= */
async function enableListening() {
  try { await openMeter(); } catch (e) {
    if (e.name === 'NotAllowedError') {
      showDiag('Microphone permission denied. Allow it in the address bar, then click Wake.');
      return;
    }
    if (e.name === 'NotFoundError') {
      showDiag('No microphone detected. Connect one and reload.');
      return;
    }
    if (e.name === 'NotReadableError') {
      showDiag('The microphone is busy — another app is using it.');
      return;
    }
  }

  wantListening = true;
  manuallyOff = false;
  restartAttempts = 0;
  micBtn.textContent = 'Sleep';
  refreshStatus();

  if (recognition) startSR();
  else subEl.textContent = 'This browser has no speech recognition — type below to chat.';
}

function disableListening() {
  wantListening = false;
  manuallyOff = true;
  clearTimeout(restartTimer);
  clearTimeout(startGuardTimer);
  if (recognition) { try { recognition.stop(); } catch (e) {} }
  recognizing = false;
  closeMeter();
  micBtn.textContent = 'Wake';
  subEl.textContent = 'Click “Wake” whenever you want to talk.';
  refreshStatus();
}

micBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (wantListening) disableListening();
  else enableListening();
});

/* =========================================================
   FIRST GESTURE BOOT
   ========================================================= */
let booted = false;
function bootOnGesture() {
  if (booted) return;
  booted = true;

  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 2;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  chooseFemaleVoice();

  if (!wantListening) enableListening();

  document.removeEventListener('click', bootOnGesture);
  document.removeEventListener('touchstart', bootOnGesture);
  document.removeEventListener('keydown', bootOnGesture);
}
document.addEventListener('click', bootOnGesture);
document.addEventListener('touchstart', bootOnGesture);
document.addEventListener('keydown', bootOnGesture);

/* =========================================================
   TYPED INPUT
   ========================================================= */
function handleTyped() {
  const txt = textInput.value.trim();
  if (!txt) return;
  textInput.value = '';
  wakePulse = 1;
  if (speaking) stopSpeech();
  const reply = Brain.respond(txt);
  if (reply.action === 'stop') { stopSpeech(); return; }
  if (reply.action === 'slower') ttsRate = Math.max(0.6, ttsRate - 0.15);
  if (reply.action === 'faster') ttsRate = Math.min(1.6, ttsRate + 0.15);
  if (reply.text) say(reply.text, reply.emotion);
}
sendBtn.addEventListener('click', (e) => { e.stopPropagation(); handleTyped(); });
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleTyped(); });

/* =========================================================
   GO
   ========================================================= */
refreshStatus();
window.addEventListener('beforeunload', () => {
  closeMeter();
  if (recognition) { try { recognition.abort(); } catch (e) {} }
});
</script>
